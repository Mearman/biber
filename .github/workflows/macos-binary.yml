name: macOS universal binary

# Builds a biber 2.17 macOS universal (arm64 + x86_64) PAR::Packer binary using a PAR::Packer commit that fixes the macOS 27 "lipo -extract_family" removal (see dist/darwin_common/pack.sh for the packing details and https://github.com/rschupp/PAR-Packer/commit/97977cb0c08ea977af9c7c7016ba5128c4cbfa0e for the upstream fix this pins).

on:
  push:
    branches: [ci/macos-universal-binary]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Attach the built binaries to a release on this repository"
        type: boolean
        default: false

env:
  PAR_PACKER_REF: 97977cb0c08ea977af9c7c7016ba5128c4cbfa0e
  # Both dist/darwin_arm/build.sh and dist/darwin_x86_64/build.sh pin perl 5.32 for the v2.17 tag, and it is also Build.PL's own declared minimum. Building this exact version from source, the same way biber's own Linux CI (.github/workflows/main.yml) builds a pinned perl rather than trusting whatever the runner ships, avoids a real compile break: biber 2.17's own lib/Biber/Section.pm relies on a deprecated Perl parsing behaviour (undef EXPR used as the lvalue target of a chained assignment, from a missing semicolon at line 431) that a Homebrew-current perl (5.44 as of writing) rejects outright as a compile error.
  PERL_VERSION: 5.32.0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-15
            output: biber-darwin_arm64
          - arch: x86_64
            os: macos-15-intel
            output: biber-darwin_x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify runner architecture
        run: |
          actual=$(uname -m)
          if [ "${actual}" != "${{ matrix.arch }}" ]; then
            echo "expected ${{ matrix.arch }}, got ${actual}" >&2
            exit 1
          fi

      - name: Install C library dependencies via Homebrew
        run: brew install gdbm gettext icu4c libxml2 libxslt openssl@3 xz

      - name: Build Perl ${{ env.PERL_VERSION }} from source
        run: |
          curl -fsSL -o perl.tar.gz "https://www.cpan.org/src/5.0/perl-${PERL_VERSION}.tar.gz"
          tar xzf perl.tar.gz
          cd "perl-${PERL_VERSION}"
          sh Configure -sde -Dprefix="${RUNNER_TEMP}/localperl"
          make -j"$(sysctl -n hw.ncpu)"
          make install
          cd ..
          rm -rf "perl-${PERL_VERSION}" perl.tar.gz
          echo "${RUNNER_TEMP}/localperl/bin" >> "${GITHUB_PATH}"

      # A standalone fatpacked script, not a CPAN module, so there is nothing for a fresh perl's own cpan/cpanm to install it with; its own shebang is a hardcoded /usr/bin/perl, so every later invocation runs it as "perl cpanm ..." rather than "./cpanm ..." to force our own pinned perl (first on PATH) as the interpreter instead of the shebang's.
      - name: Fetch cpanm
        run: curl -fsSL https://cpanmin.us -o cpanm

      - name: Configure toolchain environment
        run: |
          {
            echo "$(brew --prefix libxml2)/bin"
            echo "$(brew --prefix libxslt)/bin"
            echo "$(brew --prefix icu4c)/bin"
          } >> "${GITHUB_PATH}"
          {
            echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix libxml2)/lib/pkgconfig:$(brew --prefix libxslt)/lib/pkgconfig:$(brew --prefix icu4c)/lib/pkgconfig:$(brew --prefix gettext)/lib/pkgconfig:$(brew --prefix xz)/lib/pkgconfig"
            echo "OPENSSL_PREFIX=$(brew --prefix openssl@3)"
          } >> "${GITHUB_ENV}"

      - name: Show perl and toolchain versions
        run: |
          perl -V
          which pp 2>/dev/null || true
          pkg-config --list-all | sort

      - name: Install biber's CPAN dependencies
        run: |
          perl cpanm --notest Module::Build Config::AutoConf ExtUtils::LibBuilder
          perl Build.PL
          ./Build installdeps --cpan_client "perl $(pwd)/cpanm --notest"

      - name: Build and install biber
        run: ./Build install

      - name: Install pinned PAR::Packer
        run: perl cpanm --notest "https://github.com/rschupp/PAR-Packer/archive/${PAR_PACKER_REF}.tar.gz"

      - name: Pack biber with pp
        run: dist/darwin_common/pack.sh "${{ matrix.output }}"

      # pp appends the zipped PAR archive after the compiled Perl interpreter, so the Mach-O's own __LINKEDIT segment and LC_SYMTAB string table still declare their pre-append sizes while the file on disk is larger; codesign's strict validation rejects that mismatch with "main executable failed strict validation". PAR::Packer's own docs (lib/PAR/Packer/Troubleshooting.pod, "Code signing on macOS", added in commit 5be78ba) name this exact error and its own fix: run contrib/pp_osx_codesign_fix, which strips any pre-existing ad-hoc signature and rewrites __LINKEDIT/LC_SYMTAB to the real file size, before codesigning at all. biber's own dist/build-universal.sh calls the same helper (as ~/bin/pp_osx_codesign_fix) ahead of its own codesign step for exactly this reason.
      - name: Build the pp_osx_codesign_fix helper
        run: |
          curl -fsSL -o pp_osx_codesign_fix.c "https://raw.githubusercontent.com/rschupp/PAR-Packer/${PAR_PACKER_REF}/contrib/pp_osx_codesign_fix/pp_osx_codesign_fix.c"
          gcc -std=c99 pp_osx_codesign_fix.c -o pp_osx_codesign_fix

      - name: Ad-hoc codesign
        run: |
          chmod +x "${{ matrix.output }}"
          ./pp_osx_codesign_fix "${{ matrix.output }}"
          codesign -s - --force --options runtime "${{ matrix.output }}"
          codesign -v "${{ matrix.output }}"

      - name: Smoke test
        run: |
          xattr -c "${{ matrix.output }}" || true
          ./"${{ matrix.output }}" --version

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}
          if-no-files-found: error

  universal:
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: biber-darwin_arm64
          path: arm64

      - uses: actions/download-artifact@v4
        with:
          name: biber-darwin_x86_64
          path: x86_64

      - name: Join into a universal binary
        run: |
          chmod +x arm64/biber-darwin_arm64 x86_64/biber-darwin_x86_64
          lipo -create -output biber-darwin_universal arm64/biber-darwin_arm64 x86_64/biber-darwin_x86_64
          lipo -info biber-darwin_universal
          chmod +x biber-darwin_universal

      # lipo -create invalidates each thin binary's own signature for the joined file, so the universal binary needs its own fresh signature here. No pp_osx_codesign_fix re-run is needed: each thin binary's own __LINKEDIT/LC_SYMTAB were already corrected before it was signed, and lipo embeds each architecture's Mach-O unchanged inside the fat wrapper, so this is a plain re-sign, matching biber's own dist/build-universal.sh, which never re-runs the fix helper after lipo either.
      - name: Re-sign after lipo
        run: |
          codesign -s - --force --options runtime biber-darwin_universal
          codesign -v biber-darwin_universal

      - name: Smoke test (native slice)
        run: |
          xattr -c biber-darwin_universal || true
          ./biber-darwin_universal --version

      - uses: actions/upload-artifact@v4
        with:
          name: biber-darwin_universal
          path: biber-darwin_universal
          if-no-files-found: error

  release:
    needs: universal
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: biber-darwin_arm64
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: biber-darwin_x86_64
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: biber-darwin_universal
          path: out
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="macos-universal-v2.17-${{ github.run_number }}"
          gh release create "${tag}" \
            --repo "${{ github.repository }}" \
            --title "biber 2.17 macOS universal binary (${tag})" \
            --notes "Rebuilt against PAR::Packer commit ${PAR_PACKER_REF}, which fixes the macOS 27 lipo -extract_family removal (upstream PAR::Packer PR #97). Built from plk/biber tag v2.17 with no source changes to biber itself." \
            out/biber-darwin_universal out/biber-darwin_arm64 out/biber-darwin_x86_64
